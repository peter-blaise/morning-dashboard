name: Refresh Headlines

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 5AM ET = 9AM UTC, weekdays only
  workflow_dispatch:  # allows manual trigger too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Fetch headlines and update dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/update_headlines.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Refresh headlines $(date +'%Y-%m-%d')"
          git push
