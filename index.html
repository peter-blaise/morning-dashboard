<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Dashboard — Peter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9e9e99;
    --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.18);
    --blue: #185FA5; --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --green-bg: #EAF3DE; --green-border: #639922; --green-text: #27500A;
    --r: 8px; --rl: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2a2a27;
      --text: #f0efe9; --text2: #9e9e99; --text3: #6b6b67;
      --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.18);
      --blue: #85B7EB; --blue-bg: #042C53; --blue-text: #B5D4F4;
      --green-bg: #173404; --green-border: #3B6D11; --green-text: #C0DD97;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1.75rem; flex-wrap: wrap; }
  .date { font-size: 22px; font-weight: 500; }
  .greeting { font-size: 14px; color: var(--text2); }
  .refresh { margin-left: auto; font-size: 13px; padding: 7px 16px; cursor: pointer; border: 0.5px solid var(--border2); border-radius: var(--r); background: var(--bg); color: var(--text2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .refresh:hover { background: var(--bg2); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--rl); padding: 1.1rem 1.25rem; margin-bottom: 16px; }
  .ch { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .ct { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; }
  .ch svg { color: var(--text3); flex-shrink: 0; }
  .prow { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .prow:last-child { border-bottom: none; }
  .pbox { width: 17px; height: 17px; border: 0.5px solid var(--border2); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
  .pbox.done { background: var(--green-bg); border-color: var(--green-border); }
  .plabel { font-size: 14px; color: var(--text); line-height: 1.45; flex: 1; outline: none; }
  .plabel.done { color: var(--text3); text-decoration: line-through; }
  .addbtn { font-size: 13px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 8px 0 0; display: flex; align-items: center; gap: 4px; }
  .addbtn:hover { color: var(--text2); }
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: middle; }
  .ntabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .ntab { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 99px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; }
  .ntab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .ntab:hover:not(.active) { background: var(--bg2); }
  .nitem { padding: 9px 0; border-bottom: 0.5px solid var(--border); }
  .nitem:last-child { border-bottom: none; padding-bottom: 0; }
  .nsrc { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 3px; }
  .nlink { font-size: 14px; color: var(--text); text-decoration: none; line-height: 1.45; display: flex; align-items: flex-start; gap: 5px; }
  .nlink:hover { color: var(--blue); }
  .nlink:hover .ext { opacity: 1; }
  .ext { flex-shrink: 0; margin-top: 2px; opacity: 0; transition: opacity .15s; }
  .loading { font-size: 14px; color: var(--text3); padding: 14px 0; display: flex; align-items: center; gap: 10px; }
  .spin { width: 14px; height: 14px; border: 1.5px solid var(--border2); border-top-color: var(--text2); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .emsg { font-size: 14px; color: var(--text3); padding: 8px 0; }
  .cnt { font-size: 11px; font-weight: 400; opacity: .6; margin-left: 2px; }
  .footer-note { font-size: 11px; color: var(--text3); margin-top: 10px; }
  .footer-note a { color: var(--blue); text-decoration: none; }
  /* health */
  .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .hfield { display: flex; flex-direction: column; gap: 5px; }
  .hlabel { font-size: 12px; font-weight: 500; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .hlabel svg { color: var(--text3); flex-shrink: 0; }
  .hinput { font-size: 14px; color: var(--text); background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--r); padding: 7px 10px; outline: none; font-family: inherit; resize: none; width: 100%; transition: border-color .15s; }
  .hinput:focus { border-color: var(--border2); }
  .hinput::placeholder { color: var(--text3); }
  .hcrystal { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 0.5px solid var(--green-border); border-radius: var(--r); padding: 7px 10px; min-height: 36px; cursor: default; }
  .hcrystal-text { font-size: 14px; color: var(--text); flex: 1; line-height: 1.4; }
  .hcrystal-edit { flex-shrink: 0; background: none; border: none; cursor: pointer; color: var(--text3); padding: 0; display: flex; align-items: center; border-radius: 4px; }
  .hcrystal-edit:hover { color: var(--text2); }
  .hfield-input { display: flex; flex-direction: column; gap: 0; }
  .hfield-input .hinput { display: block; }
  .hfield-input .hcrystal { display: none; }
  .hfield-input.set .hinput { display: none; }
  .hfield-input.set .hcrystal { display: flex; }
  .hcal-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .hcal-label { font-size: 12px; color: var(--text2); flex: 1; }
  .hcal-total { font-size: 20px; font-weight: 500; color: var(--text); }
  .hcal-unit { font-size: 12px; color: var(--text3); margin-left: 3px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="date" id="datedisp"></span>
    <span class="greeting">Good morning, Peter</span>
    <button class="refresh" onclick="window.open('https://claude.ai/new?q='+encodeURIComponent('Refresh my morning dashboard with the latest headlines'),'_blank')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>

  <div class="card">
    <div class="ch">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

        </div>

      <div class="hfield">
        <label class="hlabel" for="h-eworkout">

        <div class="hfield-input" id="wrap-eworkout">
          <input id="h-eworkout" class="hinput" type="text" placeholder="e.g. 30 min bike, yoga…" onkeydown="crystallizeOnEnter(event,'eworkout')">
          <div class="hcrystal"><span class="hcrystal-text" id="crystal-eworkout"></span><button class="hcrystal-edit" onclick="uncrystallize('eworkout')" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-breakfast">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          Breakfast
        </label>
        <div class="hfield-input" id="wrap-breakfast">
          <input id="h-breakfast" class="hinput" type="text" placeholder="What did you eat?" onkeydown="crystallizeOnEnter(event,'breakfast')">
          <div class="hcrystal"><span class="hcrystal-text" id="crystal-breakfast"></span><button class="hcrystal-edit" onclick="uncrystallize('breakfast')" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-lunch">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          Lunch
        </label>
        <div class="hfield-input" id="wrap-lunch">
          <input id="h-lunch" class="hinput" type="text" placeholder="What did you eat?" onkeydown="crystallizeOnEnter(event,'lunch')">
          <div class="hcrystal"><span class="hcrystal-text" id="crystal-lunch"></span><button class="hcrystal-edit" onclick="uncrystallize('lunch')" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-dinner">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          Dinner
        </label>
        <div class="hfield-input" id="wrap-dinner">
          <input id="h-dinner" class="hinput" type="text" placeholder="What did you eat?" onkeydown="crystallizeOnEnter(event,'dinner')">
          <div class="hcrystal"><span class="hcrystal-text" id="crystal-dinner"></span><button class="hcrystal-edit" onclick="uncrystallize('dinner')" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-other">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Other calories
        </label>
        <div class="hfield-input" id="wrap-other">
          <input id="h-other" class="hinput" type="text" placeholder="Snacks, drinks, etc." onkeydown="crystallizeOnEnter(event,'other')">

        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-mweight">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12l2 7H4L6 2z"/><path d="M4 9c0 7 2 11 8 11s8-4 8-11"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
          Morning weigh-in
        </label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="h-mweight" class="hinput" type="number" step="0.1" placeholder="0.0" style="width:100%;" onblur="syncToSheets()">
          <span style="font-size:13px;color:var(--text3);white-space:nowrap;">lbs</span>
        </div>
      </div>
      <div class="hfield">
        <label class="hlabel" for="h-eweight">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12l2 7H4L6 2z"/><path d="M4 9c0 7 2 11 8 11s8-4 8-11"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
          Evening weigh-in
        </label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="h-eweight" class="hinput" type="number" step="0.1" placeholder="0.0" style="width:100%;" onblur="syncToSheets()">
          <span style="font-size:13px;color:var(--text3);white-space:nowrap;">lbs</span>

      </div>

    <div class="hcal-row">

        Estimate ↗

      <span id="sync-indicator" style="font-size:12px;"></span>

  <div class="grid2">

        <span class="ct">Personal priorities</span>

      <span class="ct">Today's headlines</span>
    </div>

    <div id="newslist"></div>
    <div class="footer-note">Last fetched: Wednesday, May 27, 2026 — <a href="#" onclick="window.open('https://claude.ai/new?q='+encodeURIComponent('Refresh my morning dashboard with the latest headlines'),'_blank');return false;">Get latest ↗</a></div>
  </div>

</div>

<script>
const SOURCES = ['WSJ','NY Post','TechCrunch','FT','The Economist','The Information','Stratechery'];

const ARTICLES = [
  // WSJ
  { source:'WSJ', headline:'Micron hits $1 trillion market cap as shares surge 19%, UBS sees 100%+ more upside', url:'https://www.wsj.com/finance/stocks/micron-technology-stock-price-trillion-market-cap' },
  { source:'WSJ', headline:'S&P 500 and Nasdaq close at record highs, led by tech and AI rally', url:'https://www.wsj.com/finance/stocks/stock-market-today-sp500-nasdaq-record-highs' },
  { source:'WSJ', headline:'Consumer confidence slips in May amid Middle East inflation concerns', url:'https://www.wsj.com/economy/consumer-confidence-may-2026-middle-east' },
  { source:'WSJ', headline:'Quantum computing stocks surge after report of $2B government grant program for nine firms', url:'https://www.wsj.com/tech/quantum-computing-stocks-government-grants-2026' },

const wItems = [
  {t:'Review Olo Q2 board prep materials', done:false},
  {t:'Follow up on active deal pipeline', done:false},
  {t:'Prep for LP call this week', done:false},
];
const pItems = [
  {t:'Schedule annual physical', done:false},
  {t:'Review weekend plans', done:false},
];

function renderP(id, arr) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  arr.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'prow';
    const box = document.createElement('div');
    box.className = 'pbox' + (item.done ? ' done' : '');
    if (item.done) box.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--green-text)"><polyline points="20 6 9 17 4 12"/></svg>';
    box.onclick = () => { arr[i].done = !arr[i].done; renderP(id, arr); };
    const lbl = document.createElement('span');
    lbl.className = 'plabel' + (item.done ? ' done' : '');
    lbl.contentEditable = true;
    lbl.textContent = item.t;
    lbl.oninput = () => { arr[i].t = lbl.textContent; };
    row.appendChild(box); row.appendChild(lbl);
    el.appendChild(row);
  });
}
function addP(type) {
  const arr = type === 'w' ? wItems : pItems;
  const id = type === 'w' ? 'wprior' : 'pprior';
  arr.push({t:'New item', done:false});
  renderP(id, arr);
  const rows = document.getElementById(id).querySelectorAll('.plabel');
  const last = rows[rows.length-1];
  last.focus();
  const r = document.createRange(); r.selectNodeContents(last);
  window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
}

let activeTab = 'all';

function buildTabs() {
  const container = document.getElementById('tabs-container');
  const allSrcs = ['all', ...SOURCES];
  container.innerHTML = allSrcs.map(s => {
    const label = s === 'all' ? 'All' : s;
    const id = 'tab-' + s;
    return `<button class="ntab${s==='all'?' active':''}" onclick="tab('${s}')" id="${id}">${label} <span class="cnt" id="c-${s}"></span></button>`;
  }).join('');
}

function tab(t) {
  activeTab = t;
  document.querySelectorAll('.ntab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  renderNews();
}

function renderNews() {
  const filtered = activeTab === 'all' ? ARTICLES : ARTICLES.filter(a => a.source === activeTab);
  const srcs = activeTab === 'all' ? SOURCES : [activeTab];
  let html = '';
  srcs.forEach(s => {
    filtered.filter(a => a.source === s).forEach(a => {
      html += `<div class="nitem">
        ${activeTab==='all' ? `<div class="nsrc">${a.source}</div>` : ''}
        <a class="nlink" href="${a.url}" target="_blank" rel="noopener">${a.headline}
          <svg class="ext" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>`;
    });
  });
  document.getElementById('newslist').innerHTML = html || '<div class="emsg">No headlines for this source.</div>';
  SOURCES.forEach(s => {
    const el = document.getElementById('c-' + s);
    if (el) el.textContent = '(' + ARTICLES.filter(a => a.source === s).length + ')';
  });
  const allEl = document.getElementById('c-all');
  if (allEl) allEl.textContent = '(' + ARTICLES.length + ')';
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbz3UbjpgyIDdaMLi49Nv9Rq7Y14UPvoKMWyFvJ4eCQUpMhSw57IZMtdBFvXjZ77cquQ/exec';
const SHEETS_TOKEN = 'Peter';
const HEALTH_FIELDS = ['h-mworkout','h-eworkout','h-breakfast','h-lunch','h-dinner','h-other','h-mweight','h-eweight'];

function saveLocal() {
  const today = new Date().toLocaleDateString();
  const data = { date: today };
  HEALTH_FIELDS.forEach(id => { data[id] = document.getElementById(id).value; });
  localStorage.setItem('health_data', JSON.stringify(data));
}

function loadLocal() {
  try {
    const saved = JSON.parse(localStorage.getItem('health_data'));
    if (!saved) return;
    const today = new Date().toLocaleDateString();
    if (saved.date !== today) { localStorage.removeItem('health_data'); return; }
    HEALTH_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (el && saved[id] !== undefined) {
        el.value = saved[id];
        const fieldId = id.replace('h-', '');
        const wrap = document.getElementById('wrap-' + fieldId);
        const crystal = document.getElementById('crystal-' + fieldId);
        if (wrap && crystal && saved[id].trim()) {
          crystal.textContent = saved[id].trim();
          wrap.classList.add('set');
        }
      }
    });
    const indicator = document.getElementById('sync-indicator');
    if (indicator) { indicator.textContent = 'Loaded today\'s data'; indicator.style.color = 'var(--text3)'; setTimeout(() => { indicator.textContent = ''; }, 2000); }
  } catch(e) {}
}

function syncToSheets() {
  const today = new Date();
  const dateStr = `${today.getMonth()+1}/${today.getDate()}/${today.getFullYear()}`;
  const payload = {
    token: SHEETS_TOKEN,
    date: dateStr,
    mworkout: document.getElementById('h-mworkout').value.trim(),
    eworkout: document.getElementById('h-eworkout').value.trim(),
    breakfast: document.getElementById('h-breakfast').value.trim(),
    lunch: document.getElementById('h-lunch').value.trim(),
    dinner: document.getElementById('h-dinner').value.trim(),
    other: document.getElementById('h-other').value.trim(),
    mweight: document.getElementById('h-mweight').value.trim(),
    eweight: document.getElementById('h-eweight').value.trim(),
  };
  const indicator = document.getElementById('sync-indicator');
  indicator.textContent = 'Saving…';
  indicator.style.color = 'var(--text3)';

  const params = new URLSearchParams(payload).toString();
  const script = document.createElement('script');
  script.src = SHEETS_URL + '?' + params + '&callback=sheetsSyncCallback';
  script.onerror = () => {
    indicator.textContent = 'Sync failed — check connection';
    indicator.style.color = '#A32D2D';
  };
  document.body.appendChild(script);
  setTimeout(() => { if (script.parentNode) script.parentNode.removeChild(script); }, 5000);
}

function sheetsSyncCallback(result) {
  const indicator = document.getElementById('sync-indicator');
  if (result && result.success) {
    indicator.textContent = 'Saved to Google Sheets ✓';
    indicator.style.color = 'var(--green-text)';
    setTimeout(() => { indicator.textContent = ''; }, 3000);
  } else {
    indicator.textContent = 'Sync failed — check token';
    indicator.style.color = '#A32D2D';
  }
}

let syncTimer = null;
function schedulSync() {
  saveLocal();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToSheets, 4000);
}

function crystallizeOnEnter(event, fieldId) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const input = document.getElementById('h-' + fieldId);
  const val = input.value.trim();
  if (!val) return;
  document.getElementById('crystal-' + fieldId).textContent = val;
  document.getElementById('wrap-' + fieldId).classList.add('set');
  saveLocal();
  syncToSheets();
}

function uncrystallize(fieldId) {
  document.getElementById('wrap-' + fieldId).classList.remove('set');
  const input = document.getElementById('h-' + fieldId);
  input.focus();
  const len = input.value.length;
  input.setSelectionRange(len, len);
}

    document.getElementById('cal-total').textContent = '—';
    document.getElementById('cal-unit').textContent = '';

}
